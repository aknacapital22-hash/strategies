# Rebalances the strategies automatically.
# After the Indian market closes: download prices, run the engine, rebuild every figure the website shows, check it
# all, and test that the website still builds. When a basket has a new signal, commit the data (Netlify and Render
# redeploy from it), then ask the backend to email subscribers. If anything fails, the admins are emailed.
#
# Repository settings > Secrets and variables > Actions:
#   secret   CRON_SECRET   the same value as CRON_SECRET on Render
#   variable BACKEND_URL   https://strategies-djiw.onrender.com
name: Rebalance strategies

on:
  schedule:
    - cron: "30 13 * * 1-5" # 19:00 IST, Monday to Friday
    - cron: "30 15 * * 1-5" # 21:00 IST: second try, and any emails still to send
  workflow_dispatch:
    inputs:
      reviewed:
        description: "I reviewed a blocked run: accept an unusually large change or price revision"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: rebalance
  cancel-in-progress: false

jobs:
  rebalance:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip # fewer Actions minutes: packages are not downloaded again each run
          cache-dependency-path: engine/requirements.txt

      - name: Install engine packages
        run: pip install -r engine/requirements.txt

      - name: Run the engine and rebuild the website figures
        env:
          REVIEWED: ${{ inputs.reviewed }}
        run: |
          cp engine/out/results.json "$RUNNER_TEMP/previous.json"
          # The price source fails now and then: try the whole step up to three times.
          for attempt in 1 2 3; do
            git checkout -- engine/out/results.json lib/strategies.json
            mkdir -p engine/data
            if python engine/fetch_data.py && python engine/fetch_indices.py && python engine/site_data.py; then exit 0; fi
            echo "attempt $attempt failed"
            sleep $((attempt * 120))
          done
          exit 1

      - name: Safety checks
        id: check
        env:
          REVIEWED: ${{ inputs.reviewed }}
        run: |
          flag=""
          if [ "$REVIEWED" = "true" ]; then flag="--allow-large-swap"; fi
          python engine/validate.py "$RUNNER_TEMP/previous.json" $flag >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.check.outputs.publish == 'true'
        with:
          node-version: "22"
          cache: npm

      - name: Make sure the website still builds with the new data
        if: steps.check.outputs.publish == 'true'
        run: |
          npm ci --include=dev
          npm run build
          git checkout -- tsconfig.json # the build may rewrite it, and the next step needs a clean tree

      - name: Publish the new portfolios and figures
        if: steps.check.outputs.publish == 'true'
        run: |
          git config user.name "rebalance-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/out/results.json lib/strategies.json
          git commit -m "Rebalance: publish new model portfolios"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Keep the published files when nothing is new
        if: steps.check.outputs.publish != 'true'
        run: git checkout -- engine/out/results.json lib/strategies.json

      - name: Email subscribers
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: python engine/notify.py

      - name: Tell the admins if anything failed
        if: failure()
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BACKEND_URL: ${{ vars.BACKEND_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python engine/notify.py --failed
